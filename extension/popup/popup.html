<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <div class="brand">
      <span class="brand-mark">JAT</span>
      <span class="brand-version" id="ext-version">v11</span>
    </div>
    <div class="conn" id="conn">
      <span class="conn-dot" id="conn-dot"></span>
      <span id="conn-text">checking…</span>
    </div>
  </header>

  <div class="pair" id="pair-row" hidden>
    <span>Approve the connection in the app window to begin.</span>
    <button class="btn primary slim" id="btn-pair">Connect</button>
  </div>

  <!-- First-run / not-set-up setup card -->
  <section class="setup" id="setup-row" hidden>
    <div class="setup-title" id="setup-title">Finish setup</div>
    <div class="setup-sub" id="setup-sub">Install the desktop app to start tracking jobs — it takes about a minute.</div>
    <button class="btn primary" id="btn-setup">Set up the app →</button>
  </section>

  <!-- This page -->
  <section class="card" id="page-card">
    <div class="card-eyebrow">This page</div>
    <div class="page-body" id="page-body">
      <div class="page-line muted" id="page-status">Reading the page…</div>
    </div>
    <button class="btn primary" id="btn-capture">📌 Track this page</button>
    <div class="hint" id="capture-hint"></div>
  </section>

  <!-- Stats -->
  <section class="stats" id="stats" hidden>
    <button class="stat" data-go="#/">
      <span class="stat-value" id="st-total">—</span>
      <span class="stat-label">Tracked</span>
    </button>
    <button class="stat" data-go="#/">
      <span class="stat-value" id="st-week">—</span>
      <span class="stat-label">This week</span>
    </button>
    <button class="stat" data-go="#/applications" id="st-review-btn">
      <span class="stat-value" id="st-review">—</span>
      <span class="stat-label">Review</span>
    </button>
  </section>

  <!-- Auto-apply -->
  <div class="aa-row" id="aa-row" hidden>
    <span class="aa-label">Auto-apply</span>
    <span class="aa-state" id="aa-state">—</span>
  </div>

  <!-- One entry point for recording, supervision, correction and recovery. -->
  <div class="aa-row" id="watch-teach-row">
    <span class="aa-label">Control studio</span>
    <button class="aa-state" id="watch-teach-btn" type="button">Open</button>
  </div>

  <!-- Recent -->
  <section class="recent" id="recent" hidden>
    <div class="card-eyebrow">Recent</div>
    <div id="recent-list"></div>
  </section>

  <!-- Update banners -->
  <section class="banner" id="ext-update-banner" hidden>
    <div class="banner-title">Extension update available</div>
    <div class="banner-sub"><span id="ext-mine"></span> → <span id="ext-latest"></span> · pull &amp; reload</div>
  </section>

  <section class="banner gold" id="update-banner" hidden>
    <div class="banner-title">Desktop app update</div>
    <div class="banner-sub"><span id="update-current"></span> → <span id="update-latest"></span></div>
    <div class="banner-actions">
      <button class="btn primary slim" id="update-now">Update now</button>
      <button class="btn slim" id="update-later">Later</button>
    </div>
    <div class="hint" id="update-status"></div>
  </section>

  <!-- Footer -->
  <footer class="foot">
    <button class="btn" id="open-dashboard">Open dashboard</button>
    <button class="btn" id="download-app">⬇ App</button>
  </footer>
  <div class="hint foot-hint" id="action-status"></div>
</body>
<script src="popup.js"></script>
</html>
