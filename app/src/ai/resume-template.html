<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pierre Salama Resume</title>
<style>
  @page { size: Letter; margin: 0.36in 0.5in; }
  /* The one difference from the emailed source: on SCREEN the page margins come
     from @page, which browsers ignore outside print, so the text would sit flush
     against the edges of the site's iframe. Print output is untouched. */
  @media screen {
    html { background: #e9ecf2; }
    body { max-width: 8.5in; margin: 0 auto; padding: 0.36in 0.5in; background: #fff; }
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Calibri", "Carlito", "Helvetica Neue", Arial, sans-serif;
    font-size: 8.8pt;
    line-height: 1.15;
    color: #14181d;
    margin: 0;
  }
  h1 {
    font-size: 19pt;
    letter-spacing: 0.4px;
    margin: 0 0 2px;
    font-weight: 700;
  }
  .role { font-size: 10pt; font-weight: 600; color: #2b3138; margin: 0 0 3px; }
  .contact { font-size: 8.6pt; color: #3a4149; margin: 0; }
  .contact a { color: #14457c; text-decoration: none; }
  hr {
    border: 0;
    border-top: 1.1px solid #99a1aa;
    margin: 6px 0 5px;
  }
  h2 {
    font-size: 9.6pt;
    text-transform: uppercase;
    letter-spacing: 1.1px;
    color: #14457c;
    margin: 7px 0 3px;
    padding-bottom: 2px;
    border-bottom: 0.8px solid #c7cdd4;
    page-break-after: avoid;
  }
  h3 {
    font-size: 9.7pt;
    margin: 5px 0 1px;
    font-weight: 700;
    page-break-after: avoid;
  }
  .meta {
    font-size: 8.5pt;
    font-style: italic;
    color: #4b535b;
    margin: 0 0 3px;
    page-break-after: avoid;
  }
  ul { margin: 2px 0 0; padding-left: 14px; }
  li { margin-bottom: 2px; page-break-inside: avoid; }
  p.skill { margin: 0 0 1.5px; padding-left: 0; }
  strong { font-weight: 700; color: #0d1116; }
  .edu { margin: 2px 0 0; }
</style>
</head>
<body>
<!-- the agent body is appended after this point -->
</body>
</html>
