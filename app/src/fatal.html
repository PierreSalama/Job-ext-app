<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Job Application Tracker</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #0a0a0a; color: #e7e7e7;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; gap: 18px;
      padding: 28px 30px; box-sizing: border-box;
    }
    h1 { font-size: 16px; font-weight: 600; margin: 0; color: #ff8a8a; letter-spacing: 0.02em; }
    pre {
      margin: 0; flex: 1; overflow: auto;
      white-space: pre-wrap; word-break: break-word;
      font-family: inherit; font-size: 13px; line-height: 1.6; color: #cfcfcf;
    }
    .foot { display: flex; justify-content: flex-end; }
    button {
      font: inherit; font-size: 12px; letter-spacing: 0.04em;
      padding: 9px 18px; cursor: pointer;
      background: #1b1b1b; color: #e7e7e7; border: 1px solid #3a3a3a;
    }
    button:hover { background: #262626; }
  </style>
</head>
<body>
  <h1 id="title">Something went wrong</h1>
  <pre id="detail"></pre>
  <div class="foot"><button id="close">Close</button></div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('title').textContent = q.get('title') || 'Something went wrong';
    document.getElementById('detail').textContent = q.get('detail') || '';
    document.getElementById('close').addEventListener('click', () => window.close());
  </script>
</body>
</html>
