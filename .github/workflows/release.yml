name: Build & Release JAT v11 installers

# Triggers:
#   • Push a tag like `v11.0.0` → build + release
#   • Manual run via "Run workflow"
on:
  push:
    tags:
      - 'v11.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dashboard mirror gate
        run: node tools/mirror.mjs --check
      - name: Version sync gate
        run: node tools/validate-versions.mjs
      - name: Install app deps (db-backed tests need node-sqlite3-wasm etc.)
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Unit tests
        # Explicit files (not a glob) so it works on Node 20 too — the test
        # runner only expands globs on Node 21+.
        run: node --test tests/status.test.mjs tests/fit.test.mjs tests/prompts.test.mjs tests/secrets.test.mjs tests/profile-memory.test.mjs tests/resume.test.mjs tests/autoapply-breakdown.test.mjs tests/data-safety.test.mjs tests/safety-rail.test.mjs tests/observer-answers.test.mjs tests/observer-nav.test.mjs tests/recipe-transfer.test.mjs tests/ai-deterministic.test.mjs tests/recipe-replay.test.mjs tests/reward-match.test.mjs tests/rank-punish.test.mjs tests/apprentice-e2e.test.mjs tests/fill-scope.test.mjs tests/teach-schema.test.mjs tests/recorder.test.mjs tests/distill-selectors.test.mjs tests/teach-correct.test.mjs tests/teach-review.test.mjs tests/easyapply-limit.test.mjs tests/glassdoor.test.mjs tests/teach-e2e.test.mjs tests/teach-bugfix.test.mjs

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: '*setup*.exe'
            label: Windows
          - os: macos-latest
            artifact: '*.dmg'
            label: macOS
          - os: ubuntu-latest
            artifact: '*.AppImage'
            label: Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Generate icons from SVG
        working-directory: app
        shell: bash
        run: |
          npm install sharp --no-save --no-audit --no-fund
          node build/make-icons.mjs

      - name: Configure Windows code-signing (only when a cert secret exists)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          SIGN_CERT: ${{ secrets.CSC_LINK }}
          SIGN_PASS: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Signing-ready WITHOUT breaking unsigned builds. We must NOT export an empty
          # CSC_LINK — electron-builder treats "" as a (broken) cert path and fails the
          # build. So only export the cert env when the secret is actually present.
          if [ -n "$SIGN_CERT" ]; then
            echo "CSC_LINK=$SIGN_CERT" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$SIGN_PASS" >> "$GITHUB_ENV"
            echo "Windows code-signing: ENABLED (certificate secret present)"
          else
            echo "Windows code-signing: skipped (no CSC_LINK secret) — unsigned build"
          fi

      - name: Build (${{ matrix.label }})
        working-directory: app
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jat-v11-${{ matrix.label }}
          path: |
            app/dist/${{ matrix.artifact }}
            app/dist/latest*.yml
            app/dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Windows is the must-pass platform; mac/linux may be absent.
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p release
          if compgen -G "artifacts/jat-v11-Windows/*.exe" > /dev/null; then
            cp artifacts/jat-v11-Windows/*.exe release/JAT-v11-setup.exe
          fi
          if compgen -G "artifacts/jat-v11-Windows/latest.yml" > /dev/null; then
            cp artifacts/jat-v11-Windows/latest.yml release/latest.yml
          fi
          if compgen -G "artifacts/jat-v11-Windows/*.blockmap" > /dev/null; then
            cp artifacts/jat-v11-Windows/*.blockmap release/ 2>/dev/null || true
          fi
          if compgen -G "artifacts/jat-v11-macOS/*.dmg" > /dev/null; then
            cp artifacts/jat-v11-macOS/*.dmg release/JAT-v11.dmg
          fi
          if compgen -G "artifacts/jat-v11-macOS/latest-mac.yml" > /dev/null; then
            cp artifacts/jat-v11-macOS/latest-mac.yml release/latest-mac.yml
          fi
          if compgen -G "artifacts/jat-v11-Linux/*.AppImage" > /dev/null; then
            cp artifacts/jat-v11-Linux/*.AppImage release/JAT-v11.AppImage
          fi
          if compgen -G "artifacts/jat-v11-Linux/latest-linux.yml" > /dev/null; then
            cp artifacts/jat-v11-Linux/latest-linux.yml release/latest-linux.yml
          fi
          ls -la release/

      - name: Checksums (SHA-256)
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          files=( *.exe *.dmg *.AppImage )
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
